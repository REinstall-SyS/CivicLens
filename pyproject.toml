[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civiclens"
version = "0.1.0"
description = "Evidence-linked public meeting records for Hattiesburg, Mississippi"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2", "fastapi>=0.115,<1", "httpx>=0.28,<1",
    "pgvector>=0.3,<1", "prefect>=3.1,<4", "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3", "PyMuPDF>=1.24,<2",
    "python-multipart>=0.0.20,<1", "python-json-logger>=3,<5", "SQLAlchemy>=2.0,<2.1",
    "tzdata>=2024.2", "uvicorn>=0.32,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
semantic = ["sentence-transformers>=3.3,<6"]
audio = ["faster-whisper>=1.1,<2"]

[project.scripts]
civiclens = "civiclens.cli:main"

[tool.setuptools.packages.find]
include = ["civiclens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
